<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Spanish Vocabulary</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <header>
    <h1>Colors</h1>
    <h2>Learn the colors in Spanish!</h2>
  </header>

  <main>
    <section>
      <h2 class="color-title" id="red">Rojo</h2>
      <img class="color" src="./assets/images/red.png" alt="The color red in Spanish: Rojo" />
    </section>

    <section>
      <h2 class="color-title" id="blue">Azul</h2>
      <img class="color" src="./assets/images/blue.png" alt="The color blue in Spanish: Azul" />
    </section>

    <section>
      <h2 class="color-title" id="orange">Anaranjado</h2>
      <img class="color" src="./assets/images/orange.png" alt="The color orange in Spanish: Anaranjado" />
    </section>

    <section>
      <h2 class="color-title" id="green">Verde</h2>
      <img class="color" src="./assets/images/green.png" alt="The color green in Spanish: Verde" />
    </section>

    <section>
      <h2 class="color-title" id="yellow">Amarillo</h2>
      <img class="color" src="./assets/images/yellow.png" alt="The color yellow in Spanish: Amarillo" />
    </section>
  </main>
</body>

</html>
