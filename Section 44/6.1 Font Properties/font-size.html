<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Font Size</title>
  <style>
    body {
      font-size: 18px;
      margin: 20px;
      font-family: Arial, sans-serif;
    }

    p {
      margin: 10px 0;
      font-size: 1.2rem;
    }

    #pixel {
      font-size: 20px;
    }

    #point {
      font-size: 20pt;
    }

    #em {
      font-size: 1em;
    }

    #rem {
      font-size: 1rem;
    }

    footer {
      font-size: 0.8rem;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <p id="pixel">1 Pixel is 1/96 of an Inch</p>
  <p id="point">1 Point is 1/72 of an Inch</p>
  <p id="em">1em is 100% the size of the parent element</p>
  <p id="rem">1rem is 100% the size of the root element</p>
</body>

</html>
